<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chiến Trường Trung Ý 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; user-select: none; }
  #ui { position: fixed; top: 15px; left: 15px; color: #fff; z-index: 20; background: rgba(15,23,42,0.85); padding: 14px 18px; border-radius: 10px; font-size: 14px; line-height: 1.7; pointer-events: none; }
  .red { color: #ff5252; font-weight: bold; }
  .blue { color: #448aff; font-weight: bold; }
  #minimap { position: fixed; bottom: 15px; right: 15px; width: 150px; height: 150px; border: 2px solid #fff; background: rgba(15,23,42,0.85); z-index: 20; border-radius: 8px; }
  #winScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 100; color: #fff; }
  #winScreen button { margin-top: 15px; padding: 12px 30px; font-size: 16px; background: #ffcc00; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div id="ui">
  <div style="color:#ffcc00;font-weight:bold;font-size:16px">⚔️ CHIẾN TRƯỜNG TRUNG Ý</div>
  <div>Phe: <span class="red">🔴 Trung Ý</span> vs <span class="blue">🔵 Trung Thành</span></div>
  <div>Nhà chính: <span id="hpRed" class="red">100%</span> vs <span id="hpBlue" class="blue">100%</span></div>
  <div>Lính: <span id="cRed">0</span>/60 | Địch: <span id="cBlue">0</span></div>
  <div style="font-size:12px;color:#ccc">WASD: Cam | Chuột trái: Chọn | Chuột phải: Đánh</div>
</div>

<canvas id="minimap" width="150" height="150"></canvas>
<div id="winScreen"><h1 id="winText"></h1><button onclick="location.reload()">CHƠI LẠI</button></div>

<script src="https://cloudflare.com"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.007);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 65, 65);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xfff5d6, 1.0);
sun.position.set(40, 80, 30);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ color: 0x3b6e22 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const river = new THREE.Mesh(new THREE.PlaneGeometry(140, 10), new THREE.MeshStandardMaterial({ color: 0x0288d1 }));
river.rotation.x = -Math.PI / 2;
river.position.y = 0.05;
scene.add(river);

[-28, 28].forEach(x => {
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(14, 0.4, 12), new THREE.MeshStandardMaterial({ color: 0x8d6e63 }));
  bridge.position.set(x, 0.2, 0);
  scene.add(bridge);
});

const bases = {
  red: { hp: 800, pos: new THREE.Vector3(0, 0, -52) },
  blue: { hp: 800, pos: new THREE.Vector3(0, 0, 52) }
};

function createBase(pos, color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 12), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 4;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(9.5, 5, 4), new THREE.MeshStandardMaterial({ color }));
  roof.position.y = 10.5;
  roof.rotation.y = Math.PI / 4;
  g.add(body, roof);
  g.position.copy(pos);
  scene.add(g);
}
createBase(bases.red.pos, 0xd32f2f);
createBase(bases.blue.pos, 0x1976d2);

const units = [], lasers = [], keys = {};
let spawnTimer = 0, gameOver = false;

function spawnUnit(team) {
  if (units.filter(u => u.team === team).length >= 60) return;
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: team === 'red' ? 0xff5252 : 0x448aff });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 2.2, 8), mat);
  body.position.y = 1.1;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 8, 8), mat);
  head.position.y = 2.6;
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.4, 16), new THREE.MeshBasicMaterial({ color: 0xffeb3b, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.08;
  ring.visible = false;
  g.add(body, head, ring);
  g.position.set((Math.random() - 0.5) * 20, 0, bases[team].pos.z + (team === 'red' ? 9 : -9));
  scene.add(g);
  units.push({ team, mesh: g, ring, hp: 60, sel: false, target: null, cd: 0 });
}
for (let i = 0; i < 8; i++) { spawnUnit('red'); spawnUnit('blue'); }

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('contextmenu', e => e.preventDefault());

renderer.domElement.addEventListener('pointerdown', e => {
  if (gameOver) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObject(ground);
  if (!hits.length) return;
  const pt = hits[0].point;

  if (e.button === 0) {
    let any = false;
    units.forEach(u => {
      if (u.team === 'red') {
        u.sel = u.mesh.position.distanceTo(pt) < 10;
        u.ring.visible = u.sel;
        if (u.sel) any = true;
      }
    });
    if (!any) units.forEach(u => { u.sel = false; u.ring.visible = false; });
  } else if (e.button === 2) {
    const sel = units.filter(u => u.team === 'red' && u.sel);
    (sel.length ? sel : units.filter(u => u.team === 'red')).forEach(u => {
      u.target = new THREE.Vector3(pt.x + (Math.random() - 0.5) * 6, 0, pt.z + (Math.random() - 0.5) * 6);
    });
  }
});

window.addEventListener('wheel', e => {
  camera.position.y = Math.max(25, Math.min(110, camera.position.y + e.deltaY * 0.05));
  camera.position.z = Math.max(25, Math.min(110, camera.position.z + e.deltaY * 0.05));
});

function shoot(a, b, team) {
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a.x, 1.8, a.z), new THREE.Vector3(b.x, 1.8, b.z)]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: team === 'red' ? 0xffeb3b : 0x00e5ff }));
  scene.add(line);
  lasers.push({ line, life: 0.12 });
}

const mCtx = document.getElementById('minimap').getContext('2d');
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if (!gameOver) {
    const cs = 45 * dt;
    if (keys['KeyW'] || keys['ArrowUp']) camera.position.z -= cs;
    if (keys['KeyS'] || keys['ArrowDown']) camera.position.z += cs;
    if (keys['KeyA'] || keys['ArrowLeft']) camera.position.x -= cs;
    if (keys['KeyD'] || keys['ArrowRight']) camera.position.x += cs;

    spawnTimer += dt;
    if (spawnTimer >= 3.0) { spawnTimer = 0; spawnUnit('red'); spawnUnit('blue'); }

    for (let i = units.length - 1; i >= 0; i--) {
      const u = units[i];
      u.cd = Math.max(0, u.cd - dt);
      const eTeam = u.team === 'red' ? 'blue' : 'red';
      const eBase = bases[eTeam];
      let enemy = null, minD = Infinity;

      for (let j = 0; j < units.length; j++) {
        if (units[j].team === eTeam) {
          const d = u.mesh.position.distanceTo(units[j].mesh.position);
          if (d < minD) { minD = d; enemy = units[j]; }
        }
      }

      if (enemy && minD <= 5) {
        u.mesh.lookAt(enemy.mesh.position);
        if (u.cd <= 0) { u.cd = 1.0; enemy.hp -= 12; shoot(u.mesh.position, enemy.mesh.position, u.team); }
      } else if (u.mesh.position.distanceTo(eBase.pos) <= 10) {
        u.mesh.lookAt(eBase.pos);
        if (u.cd <= 0) { u.cd = 1.0; eBase.hp = Math.max(0, eBase.hp - 12); shoot(u.mesh.position, eBase.pos, u.team); }
      } else {
        const dest = u.target || (enemy && minD < 25 ? enemy.mesh.position : eBase.pos);
        const dir = new THREE.Vector3().subVectors(dest, u.mesh.position);
        dir.y = 0;
        if (dir.length() > 0.8) {
          dir.normalize();
          u.mesh.position.addScaledVector(dir, 7 * dt);
          u.mesh.lookAt(u.mesh.position.clone().add(dir));
        } else if (u.target) u.target = null;
      }
    }

    for (let i = units.length - 1; i >= 0; i--) {
      if (units[i].hp <= 0) { scene.remove(units[i].mesh); units.splice(i, 1); }
    }

    document.getElementById('hpRed').textContent = Math.ceil((bases.red.hp / 800) * 100) + '%';
    document.getElementById('hpBlue').textContent = Math.ceil((bases.blue.hp / 800) * 100) + '%';
    document.getElementById('cRed').textContent = units.filter(u => u.team === 'red').length;
    document.getElementById('cBlue').textContent = units.filter(u => u.team === 'blue').length;

    if (bases.blue.hp <= 0 || bases.red.hp <= 0) {
      gameOver = true;
      document.getElementById('winScreen').style.display = 'flex';
      document.getElementById('winText').textContent = bases.blue.hp <= 0 ? '🏆 CHIẾN THẮNG!' : '💀 THẤT BẠI!';
    }
  }

  for (let i = lasers.length - 1; i >= 0; i--) {
    lasers[i].life -= dt;
    if (lasers[i].life <= 0) { scene.remove(lasers[i].line); lasers.splice(i, 1); }
  }

  mCtx.clearRect(0, 0, 150, 150);
  mCtx.fillStyle = '#0288d1'; mCtx.fillRect(0, 70, 150, 10);
  const toM = v => ((v + 70) / 140) * 150;
  mCtx.fillStyle = '#ff5252'; mCtx.fillRect(toM(bases.red.pos.x) - 5, toM(bases.red.pos.z) - 5, 10, 10);
  mCtx.fillStyle = '#448aff'; mCtx.fillRect(toM(bases.blue.pos.x) - 5, toM(bases.blue.pos.z) - 5, 10, 10);
  units.forEach(u => {
    mCtx.fillStyle = u.team === 'red' ? '#ff8a80' : '#82b1ff';
    mCtx.beginPath(); mCtx.arc(toM(u.mesh.position.x), toM(u.mesh.position.z), 2.5, 0, Math.PI * 2); mCtx.fill();
  });

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
